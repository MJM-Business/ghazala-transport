plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ghazalatransport.pos'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ghazalatransport.pos'
        minSdk 23
        targetSdk 34
        versionCode 4
        versionName '0.4.0-sunmi'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
}

dependencies {
}
