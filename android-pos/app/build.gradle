plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ghazalatransport.pos'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ghazalatransport.pos'
        minSdk 23
        targetSdk 34
        versionCode 11
        versionName '0.11.0-transparent-round-icon'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
}

dependencies {
}


tasks.register('copyOfficialGhazalaLogo', Copy) {
    from rootProject.file('../assets/ghazala-logo-original.png')
    into file('src/main/assets')
    rename { 'ghazala-logo-original.png' }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('copyOfficialGhazalaLogo')
}



